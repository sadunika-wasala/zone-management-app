<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Red Rounded Square Background -->
  <rect width="200" height="200" rx="20" fill="#D31145" />

  <!-- Outer White Arch Ring -->
  <path d="M 33 133 A 75 75 0 1 1 167 133" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />

  <!-- Mountain Vector Graphic -->
  <g fill="#FFFFFF">
    <!-- Center Peak -->
    <path d="M 103 56 C 105 60, 110 63, 115 67 C 125 75, 138 82, 150 93 C 158 100, 163 110, 165 117 C 158 113, 148 108, 137 101 C 127 95, 118 84, 111 74 C 107 83, 102 91, 98 97 C 90 106, 80 108, 70 109 C 80 109, 90 105, 96 98 C 101 92, 101 83, 98 75 C 95 68, 92 64, 103 56 Z" />

    <!-- Left Peak -->
    <path d="M 48 80 C 52 84, 57 88, 62 90 C 54 94, 43 98, 35 101 C 45 107, 58 111, 68 101 C 60 101, 52 98, 48 94 C 54 92, 60 88, 65 83 L 48 80 Z" />

    <!-- Additional Peaks Detail -->
    <path d="M 80 72 C 88 78, 93 83, 98 90 C 93 85, 87 80, 80 72 Z" />
  </g>

  <!-- Arc Text "A I A" -->
  <g fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="34" text-anchor="middle">
    <!-- Left 'A' (Rotated) -->
    <text transform="translate(62, 148) rotate(-28)">A</text>
    
    <!-- Center 'I' -->
    <text transform="translate(100, 160)">I</text>
    
    <!-- Right 'A' (Rotated) -->
    <text transform="translate(138, 148) rotate(28)">A</text>
  </g>
</svg>
